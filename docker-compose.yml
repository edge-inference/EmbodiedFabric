version: "3.8"

services:
  # LeRobot VLA Server (SmolVLA/Pi0)
  lerobot:
    build:
      context: .
      dockerfile: docker/lerobot-server/Dockerfile
    container_name: lerobot-server
    ports:
      - "5700:5700"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=${LEROBOT_GPU:-0}
      - HF_TOKEN=${HF_TOKEN:-}
      - LEROBOT_MODEL=${LEROBOT_MODEL:-smolvla}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LEROBOT_GPU:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["lerobot"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
